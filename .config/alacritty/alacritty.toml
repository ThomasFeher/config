[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
live_config_reload = true

[font]
size = 12.0

[font.bold]
family = "Iosevka Term"
style = "Bold"

[font.bold_italic]
family = "Iosevka Term"
style = "Bold Italic"

[font.italic]
family = "Iosevka Term"
style = "Italic"

[font.normal]
family = "Iosevka Term"
style = "Regular"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Equals"
mods = "Control"

[scrolling]
history = 10000
multiplier = 3

[terminal.shell]
program = "/usr/bin/zsh"
